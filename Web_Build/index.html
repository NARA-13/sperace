<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<meta name="theme-color" content="#120a1e">
<meta name="description" content="SPERACE - a fast-paced microscopic arcade racer. 101 cells, one egg, one crown.">
<title>SPERACE</title>
<link rel="manifest" href="index.manifest.json">
<style>
  :root {
    --bg0:#0d0618; --bg1:#1b0f33; --accent:#ffd166; --accent2:#7fe3ff; --pink:#ff6fae;
  }
  html, body, #canvas { margin:0; padding:0; border:0; }
  body {
    color:#f2ecff; background:var(--bg0); overflow:hidden; touch-action:none;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  #canvas { display:block; width:100vw; height:100vh; }
  #canvas:focus { outline:none; }
  #status {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; visibility:hidden;
    overflow:hidden; z-index:10;
    background:
      radial-gradient(circle at 22% 18%, rgba(255,111,174,.20), transparent 55%),
      radial-gradient(circle at 78% 76%, rgba(127,227,255,.18), transparent 52%),
      linear-gradient(160deg, #1b0f33 0%, #0d0618 60%, #140a24 100%);
  }
  /* floating cells behind the loader */
  .cell { position:absolute; width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #fff, rgba(255,255,255,.30) 55%, transparent 62%);
    opacity:.35; animation: float 9s ease-in-out infinite; }
  @keyframes float { 0%,100%{ transform:translate3d(0,0,0) scale(1);} 50%{ transform:translate3d(14px,-46px,0) scale(1.25);} }
  #brand { display:flex; align-items:center; gap:14px; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  #brand img.sperm { width:64px; image-rendering:pixelated; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  #brand img.logo { width:min(58vw, 470px); image-rendering:pixelated; filter:drop-shadow(0 8px 22px rgba(255,120,90,.28)); }
  #tagline { font-size:clamp(10px, 1.5vw, 14px); letter-spacing:.22em; color:#c8b8ee; text-transform:uppercase; }
  #barwrap { width:min(70vw, 460px); }
  #status-progress {
    -webkit-appearance:none; appearance:none; display:none; width:100%; height:14px;
    border:2px solid #6a4aa8; border-radius:8px; background:#150b26; overflow:hidden;
  }
  #status-progress::-webkit-progress-bar { background:#150b26; }
  #status-progress::-webkit-progress-value {
    background:linear-gradient(90deg, #ffd166, #ff9f1c, #ff6fae); border-radius:6px; transition:width .18s ease;
  }
  #status-progress::-moz-progress-bar { background:linear-gradient(90deg,#ffd166,#ff6fae); border-radius:6px; }
  #hint { display:none; font-size:clamp(9px,1.3vw,12px); color:#8f80ad; letter-spacing:.12em; text-align:center; }
  #hint b { color:var(--accent); }
  #status-notice {
    display:none; background:#3a1220; border:1px solid #ff6b6b; border-radius:10px;
    color:#ffe0e0; line-height:1.45; margin:0 1.5rem; max-width:640px; padding:14px 18px;
    text-align:left; font-size:13px; white-space:pre-wrap;
  }
  .keysrow { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; opacity:.75; font-size:11px; letter-spacing:.1em; }
  .key { border:1px solid #4a3470; border-radius:6px; padding:3px 8px; background:rgba(30,16,50,.7); color:#d8cdf0; }
</style>

<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1894992,"index.wasm":43699190},"focusCanvas":true,"gdextensionLibs":[],"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
  const statusOverlay = document.getElementById('status');
  const statusProgress = document.getElementById('status-progress');
  const statusNotice = document.getElementById('status-notice');
  const hint = document.getElementById('hint');

  let initializing = true;
  let statusMode = '';

  function setStatusMode(mode) {
    if (statusMode === mode || !initializing) return;
    if (mode === 'hidden') {
      statusOverlay.style.transition = 'opacity .35s ease';
      statusOverlay.style.opacity = '0';
      setTimeout(() => { statusOverlay.remove(); }, 380);
      initializing = false;
      return;
    }
    statusOverlay.style.visibility = 'visible';
    statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
    hint.style.display = mode === 'progress' ? 'block' : 'none';
    statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
    statusMode = mode;
  }

  function setStatusNotice(text) {
    while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
    text.split('\n').forEach((line) => {
      statusNotice.appendChild(document.createTextNode(line));
      statusNotice.appendChild(document.createElement('br'));
    });
  }

  function displayFailureNotice(err) {
    console.error(err);
    if (err instanceof Error) setStatusNotice(err.message);
    else if (typeof err === 'string') setStatusNotice(err);
    else setStatusNotice('An unknown error occurred.');
    setStatusMode('notice');
    initializing = false;
  }

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
      let p;
      try { p = navigator.serviceWorker.getRegistration(); }
      catch (err) { p = Promise.reject(new Error('Service worker registration failed.')); }
      Promise.race([
        p.then((registration) => {
          if (registration != null) return Promise.reject(new Error('Service worker already exists.'));
          return registration;
        }).then(() => engine.installServiceWorker()),
        new Promise((resolve) => setTimeout(() => resolve(), 2000)),
      ]).then(() => window.location.reload())
        .catch((err) => console.error('Error while registering service worker:', err));
    } else {
      displayFailureNotice('This browser is missing a feature SPERACE needs:\n' + missing.join('\n'));
    }
  } else {
    setStatusMode('progress');
    // keep the canvas focused so the keyboard works immediately
    const canvas = document.getElementById('canvas');
    const focusCanvas = () => { try { canvas.focus(); } catch (e) {} };
    canvas.setAttribute('tabindex', '0');
    focusCanvas();
    document.addEventListener('pointerdown', focusCanvas);
    document.addEventListener('keydown', focusCanvas);
    engine.startGame({
      'onProgress': function (current, total) {
        if (current > 0 && total > 0) {
          statusProgress.value = current;
          statusProgress.max = total;
          const pct = Math.round((current / total) * 100);
          hint.textContent = 'Loading the microscopic arena… ' + pct + '%';
        } else {
          statusProgress.removeAttribute('value');
          statusProgress.removeAttribute('max');
        }
      },
    }).then(() => { setStatusMode('hidden'); focusCanvas(); }, displayFailureNotice);
  }
  window.addEventListener('resize', () => {
    const c = document.getElementById('canvas');
    if (c) { c.width = Math.floor(window.innerWidth * devicePixelRatio); c.height = Math.floor(window.innerHeight * devicePixelRatio); }
  });
}());
</script>
